[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gransim"
version = "0.1.0"
description = "Vertically shaken granular DEM simulator and impact-sound synthesis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gransim = "gransim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation (real stiffness, sweeps). Run with `pytest -m slow`.",
]
addopts = "-m 'not slow'"
