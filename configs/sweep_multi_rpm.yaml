# Dataset v2 (multi-condition): every system (N, material, nuisance, recording setup) is
# observed at five shaker speeds, like the first study's voltage sweep. Material and
# microphone gain scale the level of all conditions alike; N changes how the response
# varies with Γ (where the bed fluidises), so the set of conditions breaks the
# N-vs-material degeneracy that a single condition leaves (see identifiability report).
# Fixed amplitude 1.34 cm: rpm 300/372/450/550/650 → Γ ≈ 1.35/2.07/3.04/4.54/6.34.
# Each simulated speed is the nominal one ± 4 % (the real shaker runs a few per cent off
# its setting: 6.04-6.64 Hz for a nominal 6.2 Hz); rows keep rpm_nominal / gamma_nominal.
# Sim2real (docs/RESEARCH_NOTES.md §4): e_pp up to 0.97 (the BB recordings fit nearly
# elastic particle-particle collisions), level-neutral impact-to-impact radiation spread σ.
base: configs/experiment_replica.yaml
overrides:
  contact: {model: hertz}
  excitation: {rpm: 372}
  time: {record_time: 5.3}
  acoustics: {impact_gain_norm: energy}
seed: 7077
n_dynamics: 360
renders_per_run: 3
sampling: lhs
label_key: particles.count
conditions:
  key: excitation.rpm
  values: [300, 372, 450, 550, 650]
  jitter: 0.04
blind_axes:
  - particles.diameter
  - particles.density_kg_m3
  - contact.restitution_pp
  - contact.restitution_pw
  - contact.friction_pp
  - contact.friction_pw
  - acoustics.particle_youngs_modulus
axes:
  particles.count:            {dist: int_uniform, low: 0, high: 100}
  particles.diameter:         {dist: uniform, low: 4.0e-3, high: 8.0e-3}
  particles.density_kg_m3:    {dist: loguniform, low: 1000.0, high: 4000.0}
  contact.restitution_pp:     {dist: uniform, low: 0.55, high: 0.97}
  contact.restitution_pw:     {dist: uniform, low: 0.55, high: 0.92}
  contact.friction_pp:        {dist: uniform, low: 0.1, high: 0.5}
  contact.friction_pw:        {dist: uniform, low: 0.1, high: 0.5}
  contact.wall_roughness_deg: {dist: uniform, low: 0.3, high: 2.0}   # sim2real: 0.3-0.7 deg fits the recordings best
  acoustics.particle_youngs_modulus: {dist: loguniform, low: 1.5e9, high: 5.0e9}
  acoustics.mic_gain:         {dist: loguniform, low: 0.65, high: 1.3}
  acoustics.drr:              {dist: loguniform, low: 3.0, high: 12.0}
  acoustics.noise_gain:       {dist: uniform, low: 0.5, high: 1.5}
  acoustics.impact_gain_sigma: {dist: uniform, low: 0.0, high: 1.5}
  acoustics.impact_source:    {dist: choice, values: [synthetic, recorded]}   # real BB clicks (assets/impacts)
contrast_pairs:
  same_N: 20
  same_material: 20
holdout_box:
  particles.density_kg_m3: [2800.0, 4000.0]
  contact.restitution_pw: [0.55, 0.68]
