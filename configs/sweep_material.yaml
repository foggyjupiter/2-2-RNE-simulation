# Blind-estimation dataset v1 (spec 8): count N under unknown material.
# Physics base = experiment replica (5x5x7 cm acrylic box, crank A = 1.34 cm) at the
# first-study working speed 372 rpm (Γ ≈ 2.07; estimated from the recordings).
base: configs/experiment_replica.yaml
overrides:
  contact: {model: hertz}            # validated production stiffness (Hertz, E x 0.25)
  excitation: {rpm: 372}
  time: {record_time: 5.3}           # 0.3 s acoustic warm-up + 5.0 s clip
seed: 2026
n_dynamics: 1200
renders_per_run: 4
sampling: lhs
label_key: particles.count

# Unknown material properties (spec 8.1). Ranges chosen to contain particles that can
# actually be bought and recorded for validation: 6 mm BBs are sold from 0.12 g to
# 0.43 g (ABS / bio PLA), with different hardness and restitution.
blind_axes:
  - particles.mass
  - contact.restitution_pp
  - contact.restitution_pw
  - contact.friction_pp
  - contact.friction_pw
  - acoustics.particle_youngs_modulus

axes:
  particles.count:            {dist: int_uniform, low: 0, high: 100}
  particles.mass:             {dist: loguniform, low: 1.2e-4, high: 4.3e-4}
  contact.restitution_pp:     {dist: uniform, low: 0.55, high: 0.92}
  contact.restitution_pw:     {dist: uniform, low: 0.55, high: 0.92}
  contact.friction_pp:        {dist: uniform, low: 0.1, high: 0.5}
  contact.friction_pw:        {dist: uniform, low: 0.1, high: 0.5}
  # nuisance (unknown in practice, not a label)
  contact.wall_roughness_deg: {dist: uniform, low: 1.0, high: 4.0}
  # acoustic conditions, drawn per render
  acoustics.particle_youngs_modulus: {dist: loguniform, low: 1.5e9, high: 5.0e9}
  acoustics.mic_gain:         {dist: loguniform, low: 0.65, high: 1.3}   # calibrated 0.92, ±3 dB
  acoustics.drr:              {dist: loguniform, low: 3.0, high: 12.0}   # calibrated 6
  acoustics.noise_gain:       {dist: uniform, low: 0.5, high: 1.5}

contrast_pairs:
  same_N: 100          # (a) same N, different material
  same_material: 100   # (b) same material, different N

# Held-out material region for out-of-distribution evaluation (never in train/val):
# heavy and low-restitution particles.
holdout_box:
  particles.mass: [3.2e-4, 4.3e-4]
  contact.restitution_pw: [0.55, 0.68]
