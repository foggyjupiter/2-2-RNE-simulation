# Experiment-replica preset: acrylic box with a 7x7 cm floor and 5 cm height (corrected 2026-11-10; was 5x5x7), 6 mm / 0.12 g BB pellets,
# crank-driven shaker with fixed amplitude (Γ follows from the frequency).
# Values in [brackets] in the spec are unconfirmed and can be changed here.
seed: 0
container:
  size: [0.07, 0.07, 0.05]     # inner Lx, Ly, Lz [m] (Lz = shaking direction)
  wall_thickness: 0.003        # [m]
  mass: 0.070                  # [kg]
  material: {youngs_modulus: 3.2e9, poisson_ratio: 0.37}   # acrylic
particles:
  count: 150
  diameter: 0.006              # [m]
  mass: 1.2e-4                 # [kg]
  material: {youngs_modulus: 2.3e9, poisson_ratio: 0.35}   # ABS-like
contact:
  model: linear                # relaxed stiffness for bulk generation
  contact_time: 2.0e-4         # undamped binary contact duration [s]
  restitution_pp: 0.8
  restitution_pw: 0.8
  friction_pp: 0.3
  friction_pw: 0.3
  rotation: true
excitation:
  mode: fixed_amplitude
  amplitude: 0.0134            # [m]  (Γ = 15 at 1000 rpm)
  rpm: 480                     # 8 Hz -> Γ ≈ 3.5
  ramp_time: 0.2
time:
  settle_time: 0.5
  discard_time: 1.0
  record_time: 5.0
output:
  diagnostics_interval: 1.0e-3
  save_trajectory: false
