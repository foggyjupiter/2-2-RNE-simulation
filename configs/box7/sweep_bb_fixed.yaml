# [상자 정정 2026-11-10] 실제 상자(바닥 7×7 cm, 높이 5 cm, configs/experiment_replica.yaml)로 다시 만든 데이터.
# 원래 설정(configs/sweep_bb_fixed.yaml)과 같은 설계에서 바꾼 것: 충돌별 세기 퍼짐 σ = 0(세기 퍼짐 제거 데이터와 같음),
# 대조 쌍 없음(쌍 손실 제거 실험 C3에서 효과 없음). 등화기는 새 상자로 다시 맞춤; 마이크 게인은 새 상자에서
# 다시 맞춘 값이 0.924(벽 반발 0.7 기준, 예전 0.92)라 범위를 그대로 둠 (results/sim2real/recalibration_box7.md)
# Fixed-material companion dataset (first-study style): the first-study BB (6 mm, 0.12 g)
# only, N varied. Used to train the "known material" baseline and to compare with the real
# BB recordings. What is known about the BB is fixed (size, mass, density); what is not
# measured is randomised over the range the sim2real comparison allows:
#   - restitution: the recordings fit nearly elastic BB-BB collisions with lossier
#     BB-wall impacts (e_pp ≈ 0.95, e_pw ≈ 0.7 beats e = 0.8 for both at N = 5 and 100;
#     docs/RESEARCH_NOTES.md §4) → e_pp 0.85-0.97, e_pw 0.6-0.85
#   - friction 0.2-0.4, wall micro-relief 0.3-2°
#   - shaker speed: the recordings run at 6.04-6.64 Hz for a nominal 6.2 Hz → 355-400 rpm
#   - impact-to-impact radiation spread (log-normal σ 0-1.5, level-neutral): the recorded
#     high-band envelope distribution is matched at σ ≈ 1.2
#   - click model per clip: synthetic Hertz pulse or a real recorded BB click (library cut
#     from first-study clips 1-5 of N = 5/10/15); real clicks cut the onset-count gap ~3×
# Recording conditions (mic gain, DRR, noise) as in sweep_material.yaml.
base: configs/experiment_replica.yaml
overrides:
  contact: {model: hertz}
  particles: {diameter: 0.006, mass: 1.2e-4}
  excitation: {rpm: 372}
  time: {record_time: 5.3}
  acoustics: {impact_gain_norm: energy}
seed: 4242
n_dynamics: 300
renders_per_run: 4
sampling: lhs
label_key: particles.count
blind_axes: []
axes:
  particles.count:            {dist: int_uniform, low: 0, high: 100}
  contact.restitution_pp:     {dist: uniform, low: 0.85, high: 0.97}
  contact.restitution_pw:     {dist: uniform, low: 0.6, high: 0.85}
  contact.friction_pp:        {dist: uniform, low: 0.2, high: 0.4}
  contact.friction_pw:        {dist: uniform, low: 0.2, high: 0.4}
  contact.wall_roughness_deg: {dist: uniform, low: 0.3, high: 2.0}   # sim2real: 0.3-0.7 deg fits the recordings best
  excitation.rpm:             {dist: uniform, low: 355.0, high: 400.0}
  acoustics.mic_gain:         {dist: loguniform, low: 0.65, high: 1.3}   # box7 calibrated 0.924 at e_pw 0.7 (old 0.92), ±3 dB
  acoustics.drr:              {dist: loguniform, low: 3.0, high: 12.0}
  acoustics.noise_gain:       {dist: uniform, low: 0.5, high: 1.5}
  acoustics.impact_gain_sigma: {dist: uniform, low: 0.0, high: 0.0}
  acoustics.impact_source:    {dist: choice, values: [synthetic, recorded]}   # real BB clicks (assets/impacts)
contrast_pairs: {}
